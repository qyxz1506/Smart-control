<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART CONTROL TARGET</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
input, button {
  padding: 13px;
  margin: 8px;
  border-radius: 8px;
  border: none;
}
button {
  background: #1688ff;
  color: white;
}
</style>
</head>
<body>

<h2>SMART CONTROL</h2>
<p>Perangkat tujuan</p>

<input id="code" placeholder="Masukkan kode koneksi">
<br>
<button onclick="connect()">Hubungkan</button>

<hr>

<p id="status">Belum terhubung</p>

<div id="approval" hidden>
  <p>Izinkan sesi berbagi file?</p>
  <button onclick="approve()">Izinkan</button>
  <button onclick="reject()">Tolak</button>
</div>

<h3>Berbagi file</h3>
<input type="file" id="files" multiple>
<button onclick="sendFiles()">Kirim file</button>

<h3>Kamera (izin lokal)</h3>
<button onclick="camera()">Aktifkan kamera</button>
<video id="video" autoplay playsinline width="250"></video>

<h3>Lokasi (izin lokal)</h3>
<button onclick="locationAccess()">Bagikan lokasi</button>
<p id="location"></p>

<script>
const SIGNAL = "wss://ALAMAT-SERVER-KAMU";
let ws;

function connect() {
  ws = new WebSocket(SIGNAL);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "join",
      code: document.getElementById("code").value
    }));
  };

  ws.onmessage = event => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      document.getElementById("status").textContent =
        "Terhubung. Menunggu permintaan sesi.";
    }

    if (msg.type === "relay") {
      const data = msg.data;

      if (data.type === "request") {
        document.getElementById("approval").hidden = false;
      }
    }
  };
}

function approve() {
  document.getElementById("approval").hidden = true;
  document.getElementById("status").textContent = "Sesi disetujui";
  relay({ type: "approved" });
}

function reject() {
  document.getElementById("approval").hidden = true;
  relay({ type: "rejected" });
}

function relay(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: "relay",
      data
    }));
  }
}

async function sendFiles() {
  const files = document.getElementById("files").files;

  for (const file of files) {
    const buffer = await file.arrayBuffer();

    relay({
      type: "file",
      name: file.name,
      size: file.size,
      data: Array.from(new Uint8Array(buffer))
    });
  }
}

async function camera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    document.getElementById("video").srcObject = stream;
  } catch {
    alert("Izin kamera tidak diberikan atau kamera tidak tersedia.");
  }
}

function locationAccess() {
  navigator.geolocation.getCurrentPosition(
    position => {
      document.getElementById("location").textContent =
        position.coords.latitude + ", " +
        position.coords.longitude;
    },
    () => alert("Izin lokasi tidak diberikan.")
  );
}
</script>

</body>
</html>
